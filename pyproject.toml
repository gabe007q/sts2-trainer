[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2-trainer"
version = "0.6.3"
description = "Slay the Spire 2 cheat trainer — memory patcher, overlay, and console for Windows."
requires-python = ">=3.10"
authors = [{ name = "sts2-trainer contributors" }]
dependencies = [
    "pywin32>=306",
    "psutil>=5.9.8",
    "pymem>=1.13.0",
    "structlog>=24.1.0",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "pydantic>=2.6.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4"]

[project.scripts]
sts2-trainer = "sts2_trainer.bootstrap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"